[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-shop"
version = "0.2.17"
description = "Composite: catalog shop — categories + attributes + listings + reviews, with cross-domain glue projections"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "shop", "composite", "marketplace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# A composite introduces NO versions of its own — it pins the same ranges the
# STAPEL_LIBS registry / each member lib already uses, fixing the combination.
dependencies = [
    "stapel-core>=0.10,<1.0",
    # attributes-v2 wave: categories 0.7.0, attributes 0.5.1 and listings
    # 0.10.0 ship one change together — FeatureDef gains rules/description/
    # example/default/hints/group, requiredness becomes the rule state rather
    # than `mandatory`, a rule-hidden feature is dropped from the DAO, and the
    # ref_select/ref_hierarchical_select types arrive. categories 0.7.0 itself
    # requires stapel-attributes>=0.5, so the old <0.5 cap here had NO
    # solution: pip answered ResolutionImpossible for anything installing this
    # composite next to the wave (stapel-classified 0.5.0 above all).
    # <0.9, not <0.8: stapel-categories 0.8.0 stops keying a catalog re-import
    # on the SLUG and keys it on `(external_source, external_id)` instead. An
    # imported category's slug comes from the source catalogue's node path, so
    # a source-side rename moves the slug while the node id stays — and under
    # the old key that re-import soft-deleted the row holding the listings and
    # created a duplicate beside it. A composite whose whole subject is an
    # imported marketplace catalog cannot cap a fleet under the release that
    # stops losing rows on a re-sync. 0.8.1 additionally makes a full-catalog
    # import finish at all (the tree cache was rebuilt once per row written).
    # <0.10, not <0.9: stapel-categories 0.9.0 adds the `categories.suggest`
    # comm Function a classified type-ahead needs to offer PLACES rather than
    # strings, and this cap was the wall in front of it — pip answers
    # ResolutionImpossible for anything installing this module beside it.
    # Nothing of 0.9.0 is consumed here: it is a new Function on a surface
    # this module does not call, and no model, migration or payload moved.
    # <0.11, not <0.10: stapel-categories 0.10.0 widens `Suggestion.match` from
    # two values to four so the type-ahead's caller can rank an exact name
    # above a fragment buried inside an unrelated word. Same shape as the line
    # above — a response enum on a Function this module never calls — and the
    # cap was again the only thing standing in front of it.
    # <0.12, not <0.11: stapel-categories 0.11.0 adds `Feature.visibility` —
    # the column in which the catalogue says that an attribute IDENTIFIES a
    # specific physical unit (a VIN, an IMEI, a serial number) instead of
    # describing it, and must therefore never reach an anonymous reader. Same
    # shape as the two lines above — this module reads nothing of it — but the
    # cap is again the only thing in front of it, and this one is holding a
    # fleet under the version that publishes the identifier.
    "stapel-categories>=0.4,<0.12",
    # <0.7, not <0.6: stapel-attributes 0.6.0 adds the composite `group` kind,
    # and stapel-categories 0.8.3 / stapel-listings 0.10.2 both require it.
    # A composite whose whole subject is an imported marketplace catalog —
    # where 2 468 imported fields ARE composites — cannot cap a fleet under the
    # release that can hold one: held at <0.6, pip answers ResolutionImpossible
    # for anything installing this next to categories 0.8.3, which is the same
    # trap the categories line above records twice.
    # <0.8, not <0.7: stapel-attributes 0.7.0 snapshots the chosen options'
    # `label` copy into SelectDao.labels, index-aligned with `value`, so a
    # stored `select` renders as copy instead of as its storage slug without
    # the reader fetching the category config. A live classified deployment
    # was printing slugs at people on cards, detail pages and facet chips.
    # The four projections this composite declares are exactly those readers,
    # so capping under the fix is capping under the only version that spells
    # this composite's own output correctly — and, as ever, pip does not warn:
    # it answers ResolutionImpossible next to stapel-categories 0.8.4.
    #
    # The FLOOR stays at >=0.3, and for the same reason it has stayed there
    # through every cap move above: this package reads NOTHING of attributes'
    # surface. `grep -rn stapel_attributes *.py` is empty — the module appears
    # only as a dotted path in preset.py's INSTALLED_APPS. There is no import
    # to break, no DAO built here, no `labels` read here; the range is the
    # whole coupling, and the floor is a statement about what this composite
    # itself needs, which is nothing. A host that wants the label snapshot
    # states its own >=0.7 and this line gets out of the way — which is the
    # entire job of a floor on a package that touches no surface.
    # <0.9, not <0.8: stapel-attributes 0.8.0 adds `FeatureDef.visibility` and
    # stamps it onto every stored value, which is what lets a card, a search
    # document and a bus payload — none of which has a category schema in hand
    # — tell that a value must not be published. `public` is the default and
    # is stamped as nothing at all, so every value already written is
    # byte-identical under it. Held at <0.8 this composite pins a fleet to the
    # engine with no axis at all: the catalogue has nowhere to mark the field
    # and every consumer publishes it, and pip answers ResolutionImpossible
    # next to categories 0.11.0 rather than warning — the sixth time this
    # block has recorded that.
    "stapel-attributes>=0.3,<0.9",
    # <0.9, not <0.8: stapel-listings 0.8.0 closes a live anonymous enumeration
    # oracle — the status probe returned owner_id and moderation_status for any
    # id, over sequential ids, including other people's drafts and deleted rows.
    # Held at <0.8 this composite pins a fleet to the leaking version, and pip
    # refuses the resolution outright rather than warning. The only change to
    # this composite's surface is that a stranger receives one boolean where it
    # used to receive six fields; nothing here reads the removed ones.
    # <0.10, not <0.9: listings 0.9.0 and reviews 0.4.0 add
    # ALLOW_ANONYMOUS_WRITES — the server-side guest wall. A fleet that
    # declares it while held under these caps gets an inert setting: the guest
    # is an authenticated user, passes IsAuthenticated, and can publish.
    # <0.11, not <0.10: listings 0.10.0 is this composite's half of the
    # attributes-v2 wave above — conditional requiredness and rule-hidden
    # features on the publish path, ref values carried as codes + labels
    # through the four projections.
    # <0.12, not <0.11: listings 0.11.0 is what the label snapshot above is
    # FOR. It declares `stapel-attributes>=0.7,<0.8` itself, so held at <0.11
    # this composite's own attributes line one block up has no solution and
    # pip resolves the whole fleet back to attributes 0.6.2 — the cap widened
    # in 0.2.11 doing nothing, silently, which is the failure mode this block
    # has now recorded five times. 0.11.0 also carries
    # `listings_reproject_features`: a write-time snapshot has no other way to
    # become true again, and every listing published before attributes 0.7.0
    # is stale.
    # <0.13, not <0.12: listings 0.12.0 is what the visibility axis above is
    # FOR, and it closes a live disclosure — an anonymous GET of a listing on
    # a client stand answered with the car's VIN, and the same string sat in
    # `features_search` where `?f.vin=<value>` made the index an oracle
    # confirming which advert that exact vehicle is. It keeps a non-public
    # value out of the three public projections at write time and redacts
    # `features` per viewer on the way out. It declares
    # `stapel-attributes>=0.8.1,<0.9` itself, so held at <0.12 this
    # composite's own attributes line one block up has no solution and pip
    # resolves the fleet back to 0.7.1 — the cap widened above doing nothing,
    # silently, which is the failure mode this block has now recorded six
    # times.
    "stapel-listings>=0.4,<0.13",
    # <0.6, not <0.5: stapel-reviews 0.5.0 subscribes 'user.merged' and
    # re-parents an author's reviews to the surviving account. Every app that
    # handles 'user.deleted' and stays silent on 'user.merged' is an ERROR
    # (stapel_core.lifecycle.E001), so a host that mounts this composite and
    # runs `manage.py check` is red under the old cap — and pip answers
    # ResolutionImpossible for anything that states the >=0.5 floor next to
    # this line, which is what held stapel-classified 0.5.1..0.5.3 off PyPI.
    # Nothing here reads reviews' new consumer; the range is the whole
    # coupling, so the floor stays where it is.
    "stapel-reviews>=0.2,<0.6",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-shop"
Repository = "https://github.com/usestapel/stapel-shop"
Documentation = "https://github.com/usestapel/stapel-shop#readme"
Changelog = "https://github.com/usestapel/stapel-shop/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-shop/issues"

[project.optional-dependencies]
all = []

[tool.setuptools]
package-dir = {"stapel_shop" = "."}
packages = ["stapel_shop", "stapel_shop.migrations", "stapel_shop.tests"]

[tool.setuptools.package-data]
stapel_shop = ["py.typed", "migrations/*.py", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
